[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "stattrap"
version = "0.1.0"
description = "StatTrap-SLM: do small local LLMs fall for classic statistical traps?"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "requests>=2.31", "matplotlib>=3.7"]
[project.optional-dependencies]
hf = ["transformers>=4.44", "torch", "accelerate"]
dev = ["pytest>=8"]
[project.scripts]
stattrap = "stattrap.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
